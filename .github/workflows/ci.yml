name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}

      - name: Rust fmt (check)
        working-directory: contracts
        run: cargo fmt --all --check

      - name: Rust tests
        working-directory: contracts
        run: cargo test

      - name: Build WASM (release)
        working-directory: contracts
        run: |
          cargo build -p voting --release --target wasm32-unknown-unknown
          cargo build -p token --release --target wasm32-unknown-unknown

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    needs: [contracts, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_SOROBAN_RPC_URL: ${{ secrets.VITE_SOROBAN_RPC_URL }}
      VITE_VOTING_CONTRACT_ID: ${{ secrets.VITE_VOTING_CONTRACT_ID }}
      VITE_TOKEN_CONTRACT_ID: ${{ secrets.VITE_TOKEN_CONTRACT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Validate deploy secrets
        id: deploy-secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] &&
             [ -n "$VERCEL_ORG_ID" ] &&
             [ -n "$VERCEL_PROJECT_ID" ] &&
             [ -n "$VITE_SOROBAN_RPC_URL" ] &&
             [ -n "$VITE_VOTING_CONTRACT_ID" ] &&
             [ -n "$VITE_TOKEN_CONTRACT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deploy skipped because one or more deployment secrets are missing."
          fi
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Pull Vercel project settings
        if: steps.deploy-secrets.outputs.ready == 'true'
        working-directory: frontend
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel output
        if: steps.deploy-secrets.outputs.ready == 'true'
        working-directory: frontend
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel
        if: steps.deploy-secrets.outputs.ready == 'true'
        working-directory: frontend
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
